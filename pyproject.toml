[project]
name = "testcrew"
version = "0.1.0"
description = "testCrew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[litellm,tools]==1.10.1",
    "yfinance>=1.2.0",
]

[project.scripts]
testcrew = "testcrew.main:run"
run_crew = "testcrew.main:run"
train = "testcrew.main:train"
replay = "testcrew.main:replay"
test = "testcrew.main:test"
run_with_trigger = "testcrew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
